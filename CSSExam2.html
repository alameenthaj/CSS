<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Link</title>

<style>
    a{
        display: inline-block;
        text-decoration: none;
        background-color: blue;
        color: white;
        padding: 12px 25px;
        border-radius: 5px;
        font-size: 18px;
    }

    a:hover{
        opacity: 0.6;
    }
</style>

</head>
<body>

<a href="https://www.google.com">Click Here</a>

</body>
</html>
