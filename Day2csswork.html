<html lang="en">
<head>
    <style>
        
       
        .Product-card{

            height: 400px;
            border: 2px solid #4a90e2;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 20px;
            background-color: #fff;
            box-sizing: border-box;
            text-align: center;
            border-style: dotted;
        }
        .Product-card img{
            max: width 100%;
            min-width: 200px;
            height: auto;
            border-radius: 8px;
        }

        .Product-card h3{
            color: aqua;
        }

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
</head>
<body>

     <div class="Product-card">

</html>
