<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Table</title>

<style>
    table{
        width: 60%;
        margin: 30px auto;
        border-collapse: collapse;
        border: 2px solid black;
    }

    th, td{
        border: 1px solid black;
        background-color: grey;
        color: white;
        padding: 10px;
        text-align: center;
    }

    th{
        background-color: #555;
    }
</style>

</head>
<body>

<table>
    <tr>
        <th>Id</th>
        <th>Product Name</th>
        <th>Product Price</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Laptop</td>
        <td>₹55,000</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Mobile</td>
        <td>₹25,000</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Keyboard</td>
        <td>₹1,500</td>
    </tr>

    <tr>
        <td>4</td>
        <td>Mouse</td>
        <td>₹800</td>
    </tr>

    <tr>
        <td>5</td>
        <td>Monitor</td>
        <td>₹12,000</td>
    </tr>

</table>

</body>
</html>
